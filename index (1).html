<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Fitness Up</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topo">
    <p class="marca">Fitness Up</p>
    <h1 id="titulo">Teste de acesso</h1>
  </header>

  <main class="conteudo">
    <section id="ecra-login" class="cartao amarelo" hidden>
      <h2>Entra com a tua conta Google</h2>
      <p>Usa o email que o Manager registou para ti.</p>
      <div id="botao-google"></div>
    </section>

    <section id="ecra-dados" hidden>
      <div class="cartao azul">
        <p id="quem"></p>
        <button id="sair" type="button" class="botao">Terminar sessão</button>
      </div>
      <h2 class="subtitulo">Os teus dados de teste</h2>
      <ul id="lista" class="lista"></ul>
    </section>

    <p id="estado" class="estado" role="status"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
